name: CI / Deploy

# Tests run for each changed package on pushes and PRs. A zero-downtime production deploy to the
# 104 server runs only after tests pass on `main` (or via manual dispatch).
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` además de los tres de siempre: un borrador que pasa a listo tiene que
    # volver a correr para que el job `automerge` de abajo lo vea.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# PR checks can replace older PR checks without waiting for a production build.
# Production deploys stay serialized and are never cancelled during a swap/reload.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan gate
    uses: ./.github/workflows/secret-scan.yml

  test:
    name: Unit tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.appTests == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This job gates the deploy, so its install is on the critical path:
          # a cold `npm install` was 32s of the 60s job. `app/package-lock.json`
          # IS committed (the root one is not — see .gitignore's `!app/…`
          # negation), so the npm cache can be keyed on it.
          cache: npm
          cache-dependency-path: app/package-lock.json
      # `npm install`, not `npm ci` — same as the server's deploy.sh. The cache
      # above only warms ~/.npm; it does not change how the tree is resolved.
      - run: npm install --force --no-audit --no-fund
      # Lint gates the deploy too, and not for tidiness: the guide-expansion bot
      # on the VPS runs `npm run lint` before it publishes anything, so a single
      # unformatted file merged to `main` makes EVERY expansion fail with the
      # same `prettier/prettier` wall until someone reformats it by hand. Nothing
      # in CI used to notice — `npm run test` passes on unformatted code.
      - run: npm run lint
      - run: npm run test

  deploy:
    name: Zero-downtime deploy
    needs: [secret-scan, test, backend-test, changes]
    # Deploy only for pushes to main (and manual dispatch on main); never for PRs
    # — AND only when the push actually touched the Nuxt app.
    #
    # Why the path gate: this job SSHes in and runs a full `nuxt build` on the
    # server, ~5 minutes every time. It used to run on every push to main
    # regardless of what changed. Measured on the 15 commits up to 43f5861, 13
    # of them touched zero files under `app/` — all 13 rebuilt and redeployed
    # the frontend to produce a byte-identical result. The backend half of this
    # workflow has had a path filter since it was written; the app half never
    # got one.
    #
    # `workflow_dispatch` deliberately bypasses the gate: it is the escape hatch
    # for redeploying the current main by hand (recovering a bad server state,
    # forcing a rebuild after an out-of-band change), and dorny/paths-filter has
    # no meaningful base to diff against on a manual run anyway.
    #
    # Safe to gate on `app/**` because the Nuxt app is self-contained: no
    # workspaces, no `file:` deps, no alias in nuxt.config pointing outside
    # `app/`, and every relative import that climbs out of `app/server/` lands
    # back in `app/utils/`. If that ever stops being true, widen this filter
    # BEFORE the coupling lands, because the failure mode here is a change that
    # silently never reaches production.
    if: >-
      !cancelled() &&
      needs.secret-scan.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.app == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Run remote deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Path to the app dir on the server. Override with a repo variable if
          # it ever moves; defaults to the documented location in deploy.sh.
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/root/cambio-uruguay/app' }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?missing repository secret DEPLOY_SSH_KEY}"
          : "${HOST:?missing repository secret DEPLOY_HOST}"
          : "${PORT:?missing repository secret DEPLOY_PORT}"
          : "${DEPLOY_USER:?missing repository secret DEPLOY_USER}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (TOFU on first run) so the SSH session can't be MITM'd.
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # deploy.sh pulls main, builds into a staging dir, atomically swaps
          # .output and `pm2 reload`s — the live site never goes down.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$HOST" \
            "cd '$APP_DIR' && bash scripts/deploy.sh"

  # --- Root Express backend (index.ts, classes/, sync*.ts, ecosystem.config.js…)
  # This is a SEPARATE deploy surface from app/ above: different repo area,
  # different pm2 apps, different deploy script. A CSS-only push to app/ must
  # not restart the API, and a backend-only push must not rebuild the Nuxt app
  # — hence the dedicated path filter below instead of a workflow-level `paths:`
  # (which would wrongly skip the app deploy too).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      appTests: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.appContracts == 'true' }}
      backendTests: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.backendContracts == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/deploy.yml'
            # Test-only cross-package inputs never trigger the other package's deploy.
            # Broader utility/server boundaries also cover transitive contract imports.
            appContracts:
              - 'classes/aduana/**'
              - 'classes/origins.ts'
              - 'classes/cambios/**'
              - 'classes/rentals/guarantees.ts'
              - 'classes/stores/**'
              - 'classes/equipar/registry.ts'
              # I3 (final review, Plan D): app/utils/priceEvents.ts hand-mirrors this file's calendar
              # array; a root-only edit here (e.g. the November-date manual update) must still run the
              # app suite so priceEventsCalendarParity.test.ts catches a mismatch before it deploys.
              - 'classes/priceevents/calendar.ts'
            backendContracts:
              - 'app/utils/**'
              - 'app/server/**'
              - 'app/pages/videos-de-economia-uruguay.vue'
              - 'app/pages/videos-de-economia-uruguay/**'
              # Los dos tripwires del libro de cambios (tests/revenueplan/experiments*.test.ts) leen
              # este archivo. Sin esta línea un PR que sólo agrega su fila —todos los de la corrida
              # diaria lo hacen— salteaba la suite que lo valida, y ahora esos PRs se mergean solos.
              - 'docs/seo/experiments.json'
            backend:
              - 'index.ts'
              - 'classes/**'
              - 'swagger/**'
              - 'config/**'
              - 'interfaces/**'
              - 'sync*.ts'
              - '*.ts'
              - 'ecosystem.config.js'
              - 'package.json'
              - 'tsconfig*.json'
              - 'tests/**'
              - 'scripts/deploy-backend.sh'
              - 'scripts/run-rentals.sh'
              - 'scripts/run-property-opportunities.sh'
              - 'scripts/run-autos.sh'
              - 'scripts/run-store-profiles.sh'
              - '.github/workflows/deploy.yml'

  backend-test:
    name: Backend unit tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backendTests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache downloads even though this package deliberately has no lockfile.
          # npm still resolves and installs the declared dependency ranges each run.
          cache: npm
          cache-dependency-path: package.json
      # El npm que trae Node 22 es la serie 10, y ahí `npm install` sin lockfile
      # revienta con "Cannot read properties of null (reading 'edgesOut')" — un
      # bug de arborist. Pasó dos veces seguidas el 2026-09-03 (6de2bc6 y
      # 8911768) y dejó el backend sin desplegar; el árbol está bien, la misma
      # resolución en frío con npm 11 instala 726 paquetes sin una queja.
      #
      # Y lo importante: el VPS corre Node 22.14 con **npm 11.4.2**, así que CI
      # con npm 10 no estaba reproduciendo producción, que es justamente lo que
      # este job existe para hacer.
      - run: npm i -g npm@11
      # No lockfile is committed at the repo root (package-lock.json is
      # gitignored there — only app/package-lock.json is deliberately
      # un-ignored), so install like scripts/deploy-backend.sh does — `npm
      # install`, not `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm test

  backend-deploy:
    name: Backend zero-downtime deploy
    needs: [secret-scan, test, backend-test, changes, deploy]
    # `needs: deploy` (the app deploy job above) is not a functional dependency
    # — it exists purely to sequence the two deploy jobs so their SSH sessions
    # never `git pull` the SAME repo tree at the same time (see the race note in
    # scripts/deploy-backend.sh). `always()` + the explicit result check below
    # stop that ordering constraint from also blocking a backend deploy just
    # because the (unrelated) app deploy job happened to fail.
    if: >-
      always() &&
      needs.secret-scan.result == 'success' &&
      needs.backend-test.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Run remote backend deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Path to the repo root on the server. Override with a repo variable
          # if it ever moves; defaults to the documented location in
          # scripts/deploy-backend.sh.
          REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '/root/cambio-uruguay' }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?missing repository secret DEPLOY_SSH_KEY}"
          : "${HOST:?missing repository secret DEPLOY_HOST}"
          : "${PORT:?missing repository secret DEPLOY_PORT}"
          : "${DEPLOY_USER:?missing repository secret DEPLOY_USER}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (TOFU on first run) so the SSH session can't be MITM'd.
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # deploy-backend.sh pulls main, builds into a staging dir, atomically
          # swaps dist/ and rolling-`pm2 reload`s currency-server — the live API
          # never goes down. NOTE: the first-ever run needs the script to
          # already exist on the server (it lands via this same `git pull`) —
          # see docs/superpowers/plans/2026-07-12-problemas-aduana-uruguay.md's
          # Deploy section.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$HOST" \
            "cd '$REPO_DIR' && bash scripts/deploy-backend.sh"

  # --- Los PRs propios se aprueban, se mergean y se despliegan solos ---------------------------
  # Los abren las sesiones de Claude (la corrida diaria en la nube, sesiones locales) con la cuenta
  # del dueño, y `main` exige una aprobación de alguien que NO sea quien empujó por última vez: el
  # autor no puede aprobarse a sí mismo, así que los PRs quedaban en BLOCKED para siempre. Y un PR
  # sin mergear no lo ve la corrida del día siguiente —mira `main`, no los PRs abiertos—, que
  # rehacía el mismo trabajo: #37, #38 y #39 tocaban las mismas páginas (2026-09-21..24).
  #
  # La aprobación la da `github-actions[bot]` (el repo tiene habilitado "Allow GitHub Actions to
  # create and approve pull requests"), que es otra identidad que la del último push.
  #
  # Compuerta: gitleaks + los tests unitarios de cada paquete tocado, los mismos que bloquean el
  # deploy de `main`. `E2E` / Playwright NO bloquea, igual que no bloquea el deploy.
  #
  # Sólo PRs del dueño, desde una rama de este mismo repo, contra `main`. Para frenar uno: dejarlo
  # en borrador o ponerle la etiqueta `no-automerge`.
  #
  # El deploy se DISPARA a mano después del merge: un push hecho con el GITHUB_TOKEN no dispara
  # workflows (regla de GitHub contra bucles), así que el `on: push` de arriba nunca vería este
  # merge. `workflow_dispatch` sí está permitido, y ese camino corre los tests sobre `main` y
  # despliega app y backend enteros (ver el comentario del job `deploy`).
  automerge:
    name: Auto-approve + merge
    needs: [secret-scan, test, backend-test, changes]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
      needs.changes.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEPLOYS: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Approve
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve \
            --body "Aprobado automáticamente: gitleaks y tests unitarios en verde sobre ${HEAD_SHA:0:8}."
      # `--repo` explícito: sin él gh intenta borrar también la rama local y no hay checkout.
      # `--match-head-commit`: si alguien empujó mientras corrían los tests, no se mergea algo que
      # no se probó; el push nuevo dispara su propia corrida.
      - name: Merge
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"
      # El grupo `production-deploy` admite UN run pendiente: el que llega después reemplaza al que
      # espera. Pasó el mismo día en que nació este job: los dispatch de #38 y #35 quedaron en cola
      # y un push de otra sesión que sólo tocaba el backend los canceló, así que el frontend no se
      # desplegó. Un run EN CURSO no se cancela nunca (cancel-in-progress es false para main), así
      # que se despacha recién con el grupo libre y se confirma que arrancó; si igual lo cancelaron
      # en los segundos de cola, se vuelve a intentar.
      - name: Dispatch production deploy
        if: env.DEPLOYS == 'true'
        run: |
          set -euo pipefail
          busy() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --limit 20 \
              --json status --jq '[.[] | select(.status != "completed")] | length'
          }
          for attempt in 1 2 3; do
            for _ in $(seq 1 60); do [ "$(busy)" = "0" ] && break; sleep 30; done
            since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
            for _ in $(seq 1 40); do
              sleep 15
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
                --event workflow_dispatch --limit 5 --json databaseId,status,conclusion,createdAt \
                --jq "[.[] | select(.createdAt >= \"$since\")] | last // empty")"
              [ -z "$run" ] && continue
              status="$(jq -r .status <<<"$run")"; conclusion="$(jq -r .conclusion <<<"$run")"
              if [ "$status" = "in_progress" ] || { [ "$status" = "completed" ] && [ "$conclusion" != "cancelled" ]; }; then
                echo "Deploy run $(jq -r .databaseId <<<"$run") arrancó."; exit 0
              fi
              [ "$conclusion" = "cancelled" ] && { echo "Dispatch cancelado en cola; reintento."; break; }
            done
          done
          echo "::error::El deploy despachado no llegó a arrancar en tres intentos."; exit 1
