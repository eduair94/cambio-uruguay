name: CI / Deploy

# Tests run on every push and PR. A zero-downtime production deploy to the
# 104 server runs only after tests pass on `main` (or via manual dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two production deploys at once: queue a new one, never cancel a
# deploy that is already swapping/reloading on the server.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scan gate
    uses: ./.github/workflows/secret-scan.yml

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This job gates the deploy, so its install is on the critical path:
          # a cold `npm install` was 32s of the 60s job. `app/package-lock.json`
          # IS committed (the root one is not — see .gitignore's `!app/…`
          # negation), so the npm cache can be keyed on it.
          cache: npm
          cache-dependency-path: app/package-lock.json
      # `npm install`, not `npm ci` — same as the server's deploy.sh. The cache
      # above only warms ~/.npm; it does not change how the tree is resolved.
      - run: npm install --no-audit --no-fund
      - run: npm run test

  deploy:
    name: Zero-downtime deploy
    needs: [secret-scan, test, changes]
    # Deploy only for pushes to main (and manual dispatch on main); never for PRs
    # — AND only when the push actually touched the Nuxt app.
    #
    # Why the path gate: this job SSHes in and runs a full `nuxt build` on the
    # server, ~5 minutes every time. It used to run on every push to main
    # regardless of what changed. Measured on the 15 commits up to 43f5861, 13
    # of them touched zero files under `app/` — all 13 rebuilt and redeployed
    # the frontend to produce a byte-identical result. The backend half of this
    # workflow has had a path filter since it was written; the app half never
    # got one.
    #
    # `workflow_dispatch` deliberately bypasses the gate: it is the escape hatch
    # for redeploying the current main by hand (recovering a bad server state,
    # forcing a rebuild after an out-of-band change), and dorny/paths-filter has
    # no meaningful base to diff against on a manual run anyway.
    #
    # Safe to gate on `app/**` because the Nuxt app is self-contained: no
    # workspaces, no `file:` deps, no alias in nuxt.config pointing outside
    # `app/`, and every relative import that climbs out of `app/server/` lands
    # back in `app/utils/`. If that ever stops being true, widen this filter
    # BEFORE the coupling lands, because the failure mode here is a change that
    # silently never reaches production.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.app == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Run remote deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Path to the app dir on the server. Override with a repo variable if
          # it ever moves; defaults to the documented location in deploy.sh.
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/root/cambio-uruguay/app' }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?missing repository secret DEPLOY_SSH_KEY}"
          : "${HOST:?missing repository secret DEPLOY_HOST}"
          : "${PORT:?missing repository secret DEPLOY_PORT}"
          : "${DEPLOY_USER:?missing repository secret DEPLOY_USER}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (TOFU on first run) so the SSH session can't be MITM'd.
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # deploy.sh pulls main, builds into a staging dir, atomically swaps
          # .output and `pm2 reload`s — the live site never goes down.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$HOST" \
            "cd '$APP_DIR' && bash scripts/deploy.sh"

  # --- Root Express backend (index.ts, classes/, sync*.ts, ecosystem.config.js…)
  # This is a SEPARATE deploy surface from app/ above: different repo area,
  # different pm2 apps, different deploy script. A CSS-only push to app/ must
  # not restart the API, and a backend-only push must not rebuild the Nuxt app
  # — hence the dedicated path filter below instead of a workflow-level `paths:`
  # (which would wrongly skip the app deploy too).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'index.ts'
              - 'classes/**'
              - 'swagger/**'
              - 'config/**'
              - 'interfaces/**'
              - 'sync*.ts'
              - '*.ts'
              - 'ecosystem.config.js'
              - 'package.json'
              - 'tsconfig*.json'
              - 'tests/**'
              - 'scripts/deploy-backend.sh'
              - '.github/workflows/deploy.yml'

  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El npm que trae Node 22 es la serie 10, y ahí `npm install` sin lockfile
      # revienta con "Cannot read properties of null (reading 'edgesOut')" — un
      # bug de arborist. Pasó dos veces seguidas el 2026-09-03 (6de2bc6 y
      # 8911768) y dejó el backend sin desplegar; el árbol está bien, la misma
      # resolución en frío con npm 11 instala 726 paquetes sin una queja.
      #
      # Y lo importante: el VPS corre Node 22.14 con **npm 11.4.2**, así que CI
      # con npm 10 no estaba reproduciendo producción, que es justamente lo que
      # este job existe para hacer.
      - run: npm i -g npm@11
      # No lockfile is committed at the repo root (package-lock.json is
      # gitignored there — only app/package-lock.json is deliberately
      # un-ignored), so install like scripts/deploy-backend.sh does — `npm
      # install`, not `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm test

  backend-deploy:
    name: Backend zero-downtime deploy
    needs: [secret-scan, backend-test, changes, deploy]
    # `needs: deploy` (the app deploy job above) is not a functional dependency
    # — it exists purely to sequence the two deploy jobs so their SSH sessions
    # never `git pull` the SAME repo tree at the same time (see the race note in
    # scripts/deploy-backend.sh). `always()` + the explicit result check below
    # stop that ordering constraint from also blocking a backend deploy just
    # because the (unrelated) app deploy job happened to fail.
    if: >-
      always() &&
      needs.secret-scan.result == 'success' &&
      needs.backend-test.result == 'success' &&
      needs.changes.outputs.backend == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Run remote backend deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Path to the repo root on the server. Override with a repo variable
          # if it ever moves; defaults to the documented location in
          # scripts/deploy-backend.sh.
          REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '/root/cambio-uruguay' }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?missing repository secret DEPLOY_SSH_KEY}"
          : "${HOST:?missing repository secret DEPLOY_HOST}"
          : "${PORT:?missing repository secret DEPLOY_PORT}"
          : "${DEPLOY_USER:?missing repository secret DEPLOY_USER}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (TOFU on first run) so the SSH session can't be MITM'd.
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # deploy-backend.sh pulls main, builds into a staging dir, atomically
          # swaps dist/ and rolling-`pm2 reload`s currency-server — the live API
          # never goes down. NOTE: the first-ever run needs the script to
          # already exist on the server (it lands via this same `git pull`) —
          # see docs/superpowers/plans/2026-07-12-problemas-aduana-uruguay.md's
          # Deploy section.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$HOST" \
            "cd '$REPO_DIR' && bash scripts/deploy-backend.sh"
