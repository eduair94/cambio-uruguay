name: Secret scan

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      # Pinned actions/checkout v4. The GitHub token is not persisted in the
      # checkout, and this workflow receives no repository secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked credential files
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(
            git ls-files | grep -Ei \
              '(^|/)(\.env($|\.(local|production|prod|staging|development))|\.npmrc$|\.pypirc$|\.netrc$|id_(rsa|ed25519)$|.*\.(pem|p12|pfx|key)$|serviceAccount\.json$|sheet_key\.json$|.*credentials.*\.json$|.*session.*\.json$)' \
              || true
          )"
          if [[ -n "$blocked" ]]; then
            printf '%s\n' "Tracked credential-like files are forbidden:" >&2
            printf '%s\n' "$blocked" >&2
            exit 1
          fi

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          # Read-only token of this run, used only to read the public release metadata below.
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          get() { curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$@"; }
          # github.com/<repo>/releases/download answered 504 for every repository for long
          # stretches on 2026-11-08 while the REST API kept serving the same asset, and each 504
          # blocked every merge. Retry the direct URL, then fetch the very same file through the
          # API; the pinned checksum below verifies it whichever way it came.
          if ! get --retry 3 --retry-delay 5 --retry-all-errors "$url" --output "$RUNNER_TEMP/$archive"; then
            echo "Direct release download failed; using the REST API asset endpoint." >&2
            auth=(-H "Authorization: Bearer ${GH_API_TOKEN}")
            release="https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}"
            asset_id="$(get --retry 3 --retry-delay 5 --retry-all-errors "${auth[@]}" "$release" \
              | python3 -c 'import json,sys; n=sys.argv[1]; print(next(a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==n))' "$archive")"
            get --retry 5 --retry-delay 10 --retry-all-errors "${auth[@]}" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${asset_id}" \
              --output "$RUNNER_TEMP/$archive"
          fi
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '%s\n' "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan current tracked tree
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . \
            --redact=100 \
            --no-banner \
            --no-color \
            --max-decode-depth=2 \
            --max-archive-depth=2

      - name: Scan every commit introduced by this event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ -n "$BASE_SHA" ]]; then
            log_range="${BASE_SHA}..${CURRENT_SHA}"
          elif [[ "$EVENT_NAME" == "push" ]] &&
               [[ -n "$BEFORE_SHA" ]] &&
               [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            log_range="${BEFORE_SHA}..${CURRENT_SHA}"
          else
            log_range="-1 ${CURRENT_SHA}"
          fi
          gitleaks git . \
            --log-opts="$log_range" \
            --redact=100 \
            --no-banner \
            --no-color \
            --max-decode-depth=2 \
            --max-archive-depth=2
