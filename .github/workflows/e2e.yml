name: E2E

# `npm run test:e2e` existed but nothing ever ran it, so assertions rotted
# silently (the casas-directory spec asserted 4 banks long after BBVA made it
# 5). This workflow runs the Playwright suite on every PR that touches the app
# and once a night on main, so that can't happen again.
#
# Deliberately NOT in the `deploy` job's `needs`: the suite drives a real app
# server against the live public API, so a network hiccup upstream must not be
# able to block a production deploy. It reports red and gets fixed; it does not
# gate the release train. (It drives a production build since 2026-09-18.)

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/e2e.yml'
  schedule:
    # 09:40 UTC — after the morning scrape cron has refreshed the rates.
    - cron: '40 9 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # 60, no 30: la suite se quedó sin presupuesto y con eso perdió la voz. Corrió en 10-14 min hasta
    # el 2026-09-05 y desde el 06-09 pegó contra el techo en 16 corridas seguidas — 13 días sin un
    # solo resultado, ni verde ni rojo. No se colgaba: llegaba al test 162 de 160-y-pico corriendo en
    # serie (`workers: 1`, un único dev server), y cada test en rojo se lleva su timeout completo.
    # Subir el techo devuelve el reporte; bajar el tiempo es otro trabajo (paralelizar contra un dev
    # server que compila a demanda es fácil de volver inestable).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is committed (package-lock.json is gitignored), so install
      # like the server's deploy.sh does — `npm install`, not `npm ci`.
      - run: npm install --no-audit --no-fund
      # playwright.config.ts uses `channel: 'chrome'`; the runner image ships
      # Google Chrome stable, so only the driver needs fetching.
      - run: npx playwright install-deps chromium
      # Against a production build, not `npm run dev` (see playwright.config.ts): the dev server
      # compiles each route on first visit and on this runner that no longer fits vite-node's 10 s
      # request timeout — half-rendered pages, 50 red tests, site healthy. Same build flags as
      # app/scripts/deploy.sh.
      - name: Build
        run: npx nuxt build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Run e2e suite
        run: npm run test:e2e
        env:
          E2E_PROD_SERVER: '1'
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7
